# Render Blueprint for the full stack.
# The API and the Sidekiq worker run on separate machines, so uploads must go to
# an S3-compatible bucket (AWS S3, Cloudflare R2, ...) that both can read.
# Fill in the bucket, OPENROUTER_API_KEY and the other `sync: false` values in
# the dashboard, and give the worker the same SECRET_KEY_BASE as the API.
databases:
  - name: spendflow-db
    plan: basic-256mb
    databaseName: spendflow
    user: spendflow

services:
  - type: keyvalue
    name: spendflow-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: spendflow-api
    runtime: docker
    rootDir: api
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: spendflow-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: spendflow-redis, property: connectionString }
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: ACTIVE_STORAGE_SERVICE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false

  - type: worker
    name: spendflow-sidekiq
    runtime: docker
    rootDir: api
    plan: starter
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: spendflow-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: spendflow-redis, property: connectionString }
      - key: SECRET_KEY_BASE
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: ACTIVE_STORAGE_SERVICE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false

  - type: web
    name: spendflow-web
    runtime: docker
    rootDir: web
    plan: starter
    envVars:
      - key: API_UPSTREAM
        sync: false
