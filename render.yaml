# Render Blueprint: one-click deploy of the full stack.
# Set OPENROUTER_API_KEY in the dashboard.
databases:
  - name: spendflow-db
    plan: basic-256mb
    databaseName: spendflow
    user: spendflow

services:
  - type: keyvalue
    name: spendflow-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: spendflow-api
    runtime: docker
    rootDir: api
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: spendflow-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: spendflow-redis, property: connectionString }
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: worker
    name: spendflow-sidekiq
    runtime: docker
    rootDir: api
    plan: starter
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: spendflow-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: spendflow-redis, property: connectionString }
      - key: SECRET_KEY_BASE
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: spendflow-web
    runtime: docker
    rootDir: web
    plan: starter
    envVars:
      - key: API_UPSTREAM
        sync: false
